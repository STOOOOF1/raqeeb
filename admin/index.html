<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e293b">
  <meta name="robots" content="noindex, nofollow">
  <title>رقيب — الإدارة المركزية</title>
  <link rel="icon" href="../parent/icon-192.png">
  <link rel="preload" href="../shared/fonts/cairo-arabic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../shared/style.css">
  <script src="../shared/theme.js"></script>
  <style>
    .admin-top { background: var(--hero); color: #fff; padding: 14px 16px; display: flex; align-items: center; gap: 10px; }
    .admin-top b { font-size: 1.1rem; }
    .admin-top .grow { flex: 1; }
    .admin-top button { background: rgba(255,255,255,.12); color: #fff; border: 0; border-radius: 10px; padding: 6px 12px; cursor: pointer; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .stats .card { text-align: center; padding: 12px 6px; gap: 2px; }
    .stats b { font-size: 1.5rem; }
    .fam-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .person { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--line); flex-wrap: wrap; }
    .person:last-child { border-bottom: 0; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>window.CK_ROLE = 'admin';</script>
  <script src="../shared/config.js"></script>
  <script src="../shared/vendor/supabase.js"></script>
  <script src="../shared/core.js"></script>
  <script src="../shared/tpl.js"></script>
  <script src="admin.js"></script>
</body>
</html>
